<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Commander | CCN206 Module 6</title>
<link rel="stylesheet" href="style.css">
<style>
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .bk{padding:13px 10px;border:0;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;font-size:.92rem;line-height:1.25;text-align:center;transition:transform .08s,filter .15s}
  .bk:hover{filter:brightness(1.08)} .bk:active{transform:scale(.97)} .bk:disabled{opacity:.5}
  .bk small{display:block;font-weight:500;font-size:.74rem;margin-top:2px}
  .b1{background:#0C5F6A}.b2{background:#1c7a86}.b3{background:#3b4a57}.b4{background:#9a3b3b}
  .tally{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;font-size:.78rem;color:var(--muted)}
  .tally div{background:#f7fafb;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .tally b{color:var(--ink)}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="game-title">Scan Commander <span class="chip">MODULE 6</span></h1>
  <p class="game-sub">An environmental scan has four parts. Sort each finding into the right one. In A2, the scan and strategy together are worth 50% of the marks.</p>

  <div class="topbar">
    <div class="progress" aria-hidden="true"><i id="fill"></i></div>
    <span class="scorechip" id="score">0 / 12</span>
  </div>

  <div class="card" style="font-size:1.05rem" id="card"></div>
  <div id="fb" class="feedback hide"></div>

  <div class="grid" id="btns" role="group" aria-label="Sort this finding into">
    <button type="button" class="bk b1" data-c="needs">User needs<small>what users are trying to do</small></button>
    <button type="button" class="bk b2" data-c="data">Data readiness<small>is the information ready for a bot?</small></button>
    <button type="button" class="bk b3" data-c="comp">Competitor insights<small>how other bots behave</small></button>
    <button type="button" class="bk b4" data-c="risk">Risks<small>how it could fail or be misused</small></button>
  </div>
  <div class="row"><span></span><button type="button" class="btn-ghost hide" id="next">Next</button></div>

  <div class="tally"><div>User needs: <b id="tn">0</b></div><div>Data readiness: <b id="td">0</b></div><div>Competitors: <b id="tc">0</b></div><div>Risks: <b id="tr">0</b></div></div>

  <div id="end" class="win hide">
    <h2 class="big" id="endBig" tabindex="-1"></h2>
    <p id="endMsg"></p>
    <button type="button" class="btn-ghost" onclick="restart()">Play again</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</main>

<script>
  var ITEMS=[
    {t:"Reddit threads show users can't find the refund policy.", c:"needs", w:"User friction like this counts as a user need."},
    {t:"The FAQ page contradicts the policy PDF.", c:"data", w:"Contradictory sources mean the content isn't ready for a bot, which could give conflicting or wrong answers."},
    {t:"A rival's bot hands off to a human when it's stuck.", c:"comp", w:"A competitor insight. Note how they handle fallback."},
    {t:"Users might try to make the bot say something offensive.", c:"risk", w:"A risk to plan for: users deliberately trying to misuse the bot."},
    {t:"People keep asking the same three questions on Facebook.", c:"needs", w:"Repeated questions point to core user intents to design around."},
    {t:"Key info is locked in a 60-page PDF, not structured.", c:"data", w:"A data-readiness gap. Information in a long, unstructured PDF is hard for a bot to retrieve."},
    {t:"A competitor uses a friendly first-name persona.", c:"comp", w:"A competitor insight about tone and persona."},
    {t:"The topic attracts misinformation the bot must not validate.", c:"risk", w:"A safety risk that needs guardrails."},
    {t:"Google reviews complain about long phone wait times.", c:"needs", w:"User friction the bot might relieve, so this is a user need."},
    {t:"Two pages on the site list different opening hours.", c:"data", w:"Inconsistent data. Fix it before the bot can answer reliably."},
    {t:"Trolls could spam the bot to derail conversations.", c:"risk", w:"A risk. Plan for rate limits and other guardrails."},
    {t:"A rival bot traps users in an endless menu loop.", c:"comp", w:"A competitor insight that shows what to avoid: poor fallback design."}
  ];
  var order,i,score,answered,tally;
  function el(id){return document.getElementById(id);}
  function say(msg){var s=el('sr');s.textContent='';setTimeout(function(){s.textContent=msg;},60);}
  function start(){
    order=ITEMS.map(function(_,k){return k;});
    for(var a=order.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=order[a];order[a]=order[b];order[b]=t;}
    i=0;score=0;answered=false;tally={needs:0,data:0,comp:0,risk:0};
    el('end').classList.add('hide');el('btns').classList.remove('hide');
    upd();render();
  }
  function upd(){el('tn').textContent=tally.needs;el('td').textContent=tally.data;el('tc').textContent=tally.comp;el('tr').textContent=tally.risk;}
  function render(){
    el('card').textContent='“'+ITEMS[order[i]].t+'”';
    el('fb').className='feedback hide'; el('next').classList.add('hide');
    [].forEach.call(el('btns').children,function(b){b.disabled=false;});
    el('fill').style.width=(i/ITEMS.length*100)+'%';
    el('score').textContent=score+' / '+ITEMS.length;
    answered=false;
  }
  function pick(c){
    if(answered)return; answered=true;
    var it=ITEMS[order[i]]; var right=(c===it.c);
    if(right){score++;} tally[it.c]++; upd();
    var fb=el('fb'); fb.className='feedback '+(right?'ok':'no');
    fb.innerHTML=(right?'Correct. ':'Not quite. This belongs under '+label(it.c)+'. ')+it.w;
    [].forEach.call(el('btns').children,function(b){b.disabled=true;});
    el('score').textContent=score+' / '+ITEMS.length;
    el('next').classList.remove('hide'); el('next').focus();
    say(fb.textContent+' Score '+score+' of '+ITEMS.length+'.');
  }
  function label(c){return {needs:"User needs",data:"Data readiness",comp:"Competitor insights",risk:"Risks"}[c];}
  function next(){
    i++;if(i>=ITEMS.length){finish();return;}
    render(); el('btns').children[0].focus();
    say('Finding '+(i+1)+' of '+ITEMS.length+': '+el('card').textContent);
  }
  function finish(){
    el('btns').classList.add('hide');el('card').classList.add('hide');el('fb').className='feedback hide';el('next').classList.add('hide');
    el('fill').style.width='100%';
    el('end').classList.remove('hide');
    el('endBig').textContent='Score: '+score+' / '+ITEMS.length;
    el('endMsg').textContent = score>=10 ? 'Well done. You can sort raw findings into user needs, data readiness, competitor insights and risks. That gives you a useful structure for the environmental scan in A2.'
      : 'The four parts are user needs, data readiness, competitor insights and risks. Play again to consolidate them.';
    el('endBig').focus();
    say('Game over. '+el('endBig').textContent+'. '+el('endMsg').textContent);
  }
  [].forEach.call(document.getElementById('btns').children,function(b){b.onclick=function(){pick(b.getAttribute('data-c'));};});
  el('next').onclick=next;
  function restart(){el('card').classList.remove('hide');start();el('btns').children[0].focus();}
  start();
</script>
</body>
</html>
