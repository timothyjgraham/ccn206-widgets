<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embodiment Sort | CCN206 Module 8</title>
<link rel="stylesheet" href="style.css">
<style>
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .opt{padding:14px;border:2px solid var(--line-strong);color:var(--ink);border-radius:12px;background:#fff;cursor:pointer;font-weight:700;font-size:.98rem;transition:border-color .15s,background .15s,transform .08s}
  .opt:hover{border-color:var(--teal)} .opt:active{transform:scale(.99)} .opt:disabled{cursor:default}
  .phase{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--teal-d);font-weight:800;margin:4px 0 0}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="game-title">Embodiment Sort <span class="chip">MODULE 8</span></h1>
  <p class="game-sub">A body lets a machine sense, act and be perceived, and that changes how we relate to it. First decide how each agent is embodied. Then decide whether some claims about machine sentience are myth or fact.</p>

  <div class="topbar">
    <div class="progress" aria-hidden="true"><i id="fill"></i></div>
    <span class="scorechip" id="score">0 / 10</span>
  </div>

  <h2 class="phase" id="phase"></h2>
  <div class="card" style="font-size:1.1rem" id="card"></div>
  <div class="opts" id="opts" role="group" aria-labelledby="phase"></div>
  <div id="fb" class="feedback hide"></div>
  <div class="row"><span></span><button type="button" class="btn-ghost hide" id="next">Next</button></div>

  <div id="end" class="win hide">
    <h2 class="big" id="endBig" tabindex="-1"></h2>
    <p id="endMsg"></p>
    <button type="button" class="btn-ghost" onclick="restart()">Play again</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</main>

<script>
  var BINS=["Physical body","Virtual or social presence","Text only, no presence"];
  var MF=["Myth","Fact"];
  var P1="Part 1: How is it embodied?", P2="Part 2: Myth or fact?";
  var R=[
    {phase:P1, q:"A robot vacuum (Roomba)", o:BINS, c:0, w:"Physical. It senses the room and moves through it using sensors and actuators."},
    {phase:P1, q:"A warehouse robot arm", o:BINS, c:0, w:"Physical. It has a real body that acts in the world."},
    {phase:P1, q:"A 3D avatar that gestures and speaks in VR", o:BINS, c:1, w:"Virtual or social. It has no physical body, but it has a consistent presence that people can see and hear."},
    {phase:P1, q:"A chatbot with an animated face and voice", o:BINS, c:1, w:"Virtual or social. It creates a presence through face, voice and gesture."},
    {phase:P1, q:"A plain email auto-reply", o:BINS, c:2, w:"No presence, just text. Where a text-only chatbot such as ChatGPT fits is open to debate."},
    {phase:P1, q:"A command-line script", o:BINS, c:2, w:"No presence. It acts, but people don't perceive it as a social or physical being."},
    {phase:P2, q:"In 2022 a Google engineer publicly claimed the chatbot LaMDA was sentient.", o:MF, c:1, w:"Fact. Blake Lemoine made the claim in June 2022. Google called it “wholly unfounded” and dismissed him in July 2022, citing breaches of its confidentiality policies. Most experts rejected the claim."},
    {phase:P2, q:"Most AI researchers agree today's LLM chatbots are conscious.", o:MF, c:0, w:"Myth. Most researchers do not think current chatbots are conscious. A 2023 review by Butlin, Long and colleagues concluded that no current AI system is conscious, although the question is still debated."},
    {phase:P2, q:"A fluent, human-like reply proves a system has feelings.", o:MF, c:0, w:"Myth. Reading a mind into fluent output is known as the ELIZA effect."},
    {phase:P2, q:"Giving a machine a physical body changes how we communicate with it.", o:MF, c:1, w:"Fact, in the sense used in this module. A body shapes how we interpret a machine and how we relate to it."}
  ];
  var i,score,answered;
  function el(id){return document.getElementById(id);}
  function say(msg){var s=el('sr');s.textContent='';setTimeout(function(){s.textContent=msg;},60);}
  function start(){i=0;score=0;answered=false;el('end').classList.add('hide');el('phase').classList.remove('hide');render();}
  function render(){
    var r=R[i];
    el('phase').textContent=r.phase;
    el('card').textContent=r.q;
    var O=el('opts');O.innerHTML='';
    r.o.forEach(function(label,k){
      var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=label;
      b.onclick=function(){pick(k,b);};O.appendChild(b);
    });
    el('fb').className='feedback hide';el('next').classList.add('hide');
    el('fill').style.width=(i/R.length*100)+'%';
    el('score').textContent=score+' / '+R.length;
    answered=false;
  }
  function pick(k,b){
    if(answered)return;answered=true;
    var r=R[i];var right=(k===r.c);
    if(right)score++;
    var opts=el('opts').children;
    for(var j=0;j<opts.length;j++){opts[j].disabled=true;}
    b.style.borderColor=right?'var(--ok)':'var(--no)';b.style.background=right?'var(--ok-bg)':'var(--no-bg)';
    if(!right){opts[r.c].style.borderColor='var(--ok)';opts[r.c].style.background='var(--ok-bg)';}
    var fb=el('fb');fb.className='feedback '+(right?'ok':'no');
    fb.innerHTML=(right?'Correct. ':'Not quite. The answer is “'+r.o[r.c]+'”. ')+r.w;
    el('score').textContent=score+' / '+R.length;
    el('next').classList.remove('hide'); el('next').focus();
    say(fb.textContent+' Score '+score+' of '+R.length+'.');
  }
  function next(){
    i++;if(i>=R.length){finish();return;}
    render(); el('opts').children[0].focus();
    say(R[i].phase+' Item '+(i+1)+' of '+R.length+': '+R[i].q);
  }
  function finish(){
    el('phase').textContent='';el('phase').classList.add('hide');el('card').classList.add('hide');el('opts').innerHTML='';el('fb').className='feedback hide';el('next').classList.add('hide');
    el('fill').style.width='100%';
    el('end').classList.remove('hide');
    el('endBig').textContent='Score: '+score+' / '+R.length;
    el('endMsg').textContent = score>=8 ? 'Well done. A body shapes how we relate to a machine, and a fluent reply is not evidence of feelings.'
      : 'Two ideas to keep in mind: embodiment means sensing, acting and being perceived, and a convincing reply is not evidence of a conscious mind (the ELIZA effect). Try again?';
    el('endBig').focus();
    say('Game over. '+el('endBig').textContent+'. '+el('endMsg').textContent);
  }
  el('next').onclick=next;
  function restart(){el('card').classList.remove('hide');start();el('opts').children[0].focus();}
  start();
</script>
</body>
</html>
