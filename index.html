<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCN206 Bot Games</title>
<link rel="stylesheet" href="style.css">
<style>
  .hub-head{text-align:center;margin-bottom:6px}
  .hub-head h1{font-size:1.7rem;font-weight:800;margin:0}
  .hub-head p{color:var(--muted);margin:6px 0 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:18px 0 0;padding:0;list-style:none}
  .gcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
  .gcard:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(8,69,78,.14)}
  .gcard .mod{font-size:.68rem;font-weight:800;letter-spacing:.4px;color:#fff;background:var(--teal);align-self:flex-start;padding:2px 9px;border-radius:999px}
  .gcard h2{margin:10px 0 2px;font-size:1.12rem}
  .gcard .mech{font-size:.82rem;color:var(--muted);flex:1}
  .gcard .desc{font-size:.9rem;margin:8px 0 12px}
  .play{display:block;text-align:center;text-decoration:none;background:var(--teal);color:#fff;font-weight:700;padding:11px;border-radius:12px;transition:filter .15s}
  .play:hover{filter:brightness(1.1)}
  .wrap{max-width:860px}
  .foot{text-align:center;color:var(--muted);font-size:.82rem;margin-top:22px}
</style>
</head>
<body>
<main class="wrap">
  <div class="hub-head">
    <h1>CCN206 Bot Games</h1>
    <p>Short games to accompany the modules in <em>Communicating with Bots</em>. Each one takes two to five minutes.</p>
  </div>
  <ul class="cards" id="cards"></ul>
  <p class="foot">Made for CCN206 Communicating with Bots.</p>
</main>
<script>
  var GAMES=[
    {m:"Module 1",t:"Timeline Tango",mech:"Sequencing",d:"Put eight chatbots, from ELIZA to ChatGPT, in the order they appeared.",f:"m1-timeline.html"},
    {m:"Module 2",t:"Spot the Bot",mech:"Classification",d:"Decide whether each profile belongs to a person or an automated account. Relates to A1.",f:"m2-spot-the-bot.html"},
    {m:"Module 3",t:"Mind the Machine",mech:"Two-way sort",d:"Sort reactions to machines into social responses (CASA) and the machine heuristic.",f:"m3-mind-the-machine.html"},
    {m:"Module 4",t:"Intent or Entity?",mech:"Classification",d:"Decide whether each item is the user's goal or a detail the bot extracts. Relates to A2.",f:"intent-or-entity-sorter.html"},
    {m:"Module 4",t:"Entity Hunter",mech:"Highlighting",d:"Select the entities a bot would extract from each message. Relates to A2.",f:"m4-entity-hunter.html"},
    {m:"Module 5",t:"Conversation Sim",mech:"Branching scenario",d:"Choose the bot's reply at each turn of a support conversation. Relates to A2.",f:"m5-conversation-sim.html"},
    {m:"Module 6",t:"Scan Commander",mech:"Four-way sort",d:"Sort findings into the four parts of an environmental scan. Relates to A2.",f:"m6-scan-commander.html"},
    {m:"Modules 3 and 7",t:"Habitat Match",mech:"Matching",d:"Match each helper-bot job to the platform that suits it.",f:"m7-habitat-match.html"},
    {m:"Module 8",t:"Embodiment Sort",mech:"Sort, then myth or fact",d:"Decide how each agent is embodied, then test some claims about machine sentience.",f:"m8-embodiment-sort.html"}
  ];
  var C=document.getElementById('cards');
  GAMES.forEach(function(g){
    var d=document.createElement('li');d.className='gcard';
    d.innerHTML='<span class="mod">'+g.m+'</span><h2>'+g.t+'</h2><div class="mech">'+g.mech+'</div><div class="desc">'+g.d+'</div><a class="play" href="'+g.f+'">Play<span class="sr-only"> '+g.t+'</span></a>';
    C.appendChild(d);
  });
</script>
</body>
</html>
