<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spot the Bot | CCN206 Module 2</title>
<link rel="stylesheet" href="style.css">
<style>
  .acct{background:var(--card);border:2px solid var(--teal);border-radius:14px;padding:16px;box-shadow:var(--shadow);animation:pop .25s ease;text-align:left}
  .acct .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .av{width:42px;height:42px;border-radius:50%;background:#cfd8dc;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#37474f}
  .handle{font-weight:800}
  .meta{font-size:.8rem;color:var(--muted)}
  .stats{font-size:.86rem;margin:6px 0}
  .stats span{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:3px 4px 0 0}
  .post{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:.92rem;font-style:italic}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="game-title">Spot the Bot <span class="chip">MODULE 2</span></h1>
  <p class="game-sub">Is each profile a real person or an automated account? Make your call, then read the explanation. No single signal proves that an account is a bot, so weigh the patterns together. This game relates to Assessment 1.</p>

  <div class="topbar">
    <div class="progress" aria-hidden="true"><i id="fill"></i></div>
    <span class="scorechip" id="score">0 / 8</span>
    <span class="streak" id="streak">Streak: 0</span>
  </div>

  <div id="stage"></div>

  <div class="btns" id="btns" style="margin-top:12px">
    <button type="button" class="choice" id="bHuman">Human</button>
    <button type="button" class="choice alt" id="bBot">Bot</button>
  </div>

  <div id="fb" class="feedback hide"></div>
  <div class="row"><span></span><button type="button" class="btn-ghost hide" id="next">Next</button></div>

  <div id="end" class="win hide">
    <h2 class="big" id="endBig" tabindex="-1"></h2>
    <p id="endMsg"></p>
    <button type="button" class="btn-ghost" onclick="restart()">Play again</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</main>

<script>
  // All profiles are FICTIONAL / illustrative. Tells reflect documented bot-detection signals
  // (Ferrara et al., 2016; Botometer feature families) and Letourneau (2025) on instrumental bot identities.
  var DECK=[
    {handle:"@SunnyMornings_88", meta:"joined 2 weeks ago", stats:["240 posts a day","100% reshares","default avatar"], post:"RT RT RT 🔁 BREAKING 🔁 RT", bot:true,
      tell:"<b>Bot.</b> Very high volume, nothing but reshares (reverberation) and a brand-new account. This pattern fits an amplifier account."},
    {handle:"@kaz_makes_pottery", meta:"member since 2021", stats:["about 3 posts a week","photos over 4 years","replies to friends"], post:"third firing cracked again 😭 anyone know a good clay for thermal shock?", bot:false,
      tell:"<b>Human.</b> A long, varied history and real back-and-forth with friends. That kind of reciprocity is hard to fake at scale."},
    {handle:"@Patriot_Eagle_Liberty77", meta:"active only during the vote", stats:["hashtag-stuffed posts","identical talking points","no personal posts"], post:"WAKE UP! #Rigged #DoYourResearch #Rigged #DoYourResearch", bot:true,
      tell:"<b>Bot.</b> The account performs a patriotic identity to push one message, which Letourneau (2025) calls an <i>instrumental identity</i>. It is active only around one event, stuffs its posts with popular hashtags (window dressing) and repeats copy-and-paste lines."},
    {handle:"@derek_plumbing_bne", meta:"local business", stats:["answers customer messages","job-site photos","the odd typo"], post:"back-to-back jobs in Paddington today, slow to reply sorry! ring the office", bot:false,
      tell:"<b>Human.</b> Specific local detail, real customer service and uneven reply times all point to a person."},
    {handle:"@news_now_feed", meta:"bio: “automated headlines”", stats:["posts every 10 min","links to sources","openly labelled a bot"], post:"[AUTO] Council approves new ferry timetable (link)", bot:true,
      tell:"<b>Bot, but a benign one.</b> It is an openly labelled news aggregator. Not all bots are malicious, and transparency and purpose matter."},
    {handle:"@mia.travels", meta:"member since 2019", stats:["irregular posting","context-rich replies","years of photos"], post:"missed the train in Lisbon lol, ended up at the best little pastéis place", bot:false,
      tell:"<b>Human.</b> Irregular, specific and responsive posting that does not look like a scripted feed."},
    {handle:"@GiveawayKing_Official", meta:"joined 3 days ago", stats:["“DM to claim prize”","thousands of identical replies","stock photo"], post:"🎉 YOU WON! DM now to claim before it expires 🎉", bot:true,
      tell:"<b>Bot.</b> This is a common scam pattern: a new account, identical mass replies, urgency and a prize that is too good to be true. Don't send it a message."},
    {handle:"@tom_indie_dev", meta:"member since 2018", stats:["posts about one project","banter and replies","inconsistent timing"], post:"shipped the save-game feature at 2am, immediately found a bug. classic.", bot:false,
      tell:"<b>Human.</b> A consistent personal story over several years and self-deprecating banter with other people."}
  ];
  var order, i, score, streak, answered;
  function el(id){return document.getElementById(id);}
  function say(msg){var s=el('sr');s.textContent='';setTimeout(function(){s.textContent=msg;},60);}
  function start(){
    order=DECK.map(function(_,k){return k;});
    for(var a=order.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=order[a];order[a]=order[b];order[b]=t;}
    i=0;score=0;streak=0;answered=false;
    el('end').classList.add('hide');
    el('btns').classList.remove('hide');
    render();
  }
  function render(){
    var d=DECK[order[i]];
    el('stage').innerHTML='<div class="acct"><div class="h"><div class="av" aria-hidden="true">'+d.handle.charAt(1).toUpperCase()+'</div><div><div class="handle">'+d.handle+'</div><div class="meta">'+d.meta+'</div></div></div>'+
      '<div class="stats">'+d.stats.map(function(s){return '<span>'+s+'</span>';}).join('')+'</div>'+
      '<div class="post">'+d.post+'</div></div>';
    el('fb').className='feedback hide'; el('next').classList.add('hide');
    el('bHuman').disabled=false; el('bBot').disabled=false;
    el('fill').style.width=(i/DECK.length*100)+'%';
    el('score').textContent=score+' / '+DECK.length;
    el('streak').textContent='Streak: '+streak;
    answered=false;
  }
  function answer(saidBot){
    if(answered)return; answered=true;
    var d=DECK[order[i]]; var right=(saidBot===d.bot);
    if(right){score++;streak++;} else {streak=0;}
    var fb=el('fb'); fb.className='feedback '+(right?'ok':'no');
    fb.innerHTML=(right?'Correct. ':'Not quite. ')+d.tell;
    el('bHuman').disabled=true; el('bBot').disabled=true;
    el('score').textContent=score+' / '+DECK.length;
    el('streak').textContent='Streak: '+streak;
    el('next').classList.remove('hide'); el('next').focus();
    say(fb.textContent+' Score '+score+' of '+DECK.length+'.');
  }
  function next(){
    i++; if(i>=DECK.length){finish();return;}
    render(); el('bHuman').focus();
    say('Profile '+(i+1)+' of '+DECK.length+': '+DECK[order[i]].handle+'.');
  }
  function finish(){
    el('btns').classList.add('hide'); el('fb').className='feedback hide'; el('next').classList.add('hide');
    el('stage').innerHTML=''; el('fill').style.width='100%';
    var e=el('end'); e.classList.remove('hide');
    el('endBig').textContent='Score: '+score+' / '+DECK.length;
    el('endMsg').textContent = score>=7 ? 'Well done. You weighed several patterns together (volume, reciprocity, account history and transparency), and that kind of judgement is useful for A1.'
      : (score>=5 ? 'A good result. Keep looking at the overall pattern, and remember that some bots are benign.' : 'These signals can be hard to read. Review the Module 2 material on mimicry, window dressing and reverberation, then try again.');
    el('endBig').focus();
    say('Game over. '+el('endBig').textContent+'. '+el('endMsg').textContent);
  }
  el('bHuman').onclick=function(){answer(false);};
  el('bBot').onclick=function(){answer(true);};
  el('next').onclick=next;
  function restart(){start(); el('bHuman').focus();}
  start();
</script>
</body>
</html>
