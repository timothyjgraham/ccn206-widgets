<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intent or Entity? | CCN206 Module 4</title>
<style>
  :root{ --teal:#0C5F6A; --ink:#222; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:20px;background:#fff;color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:1.25rem;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:#555;font-size:.95rem}
  .bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin:10px 0}
  .fill{height:100%;background:var(--teal);width:0;transition:width .3s}
  .item{font-size:1.35rem;font-weight:700;text-align:center;padding:22px 16px;border:2px solid var(--teal);border-radius:12px;background:#f0f7f8;margin:12px 0}
  .btns{display:flex;gap:10px}
  button.choice{flex:1;padding:15px;font-size:1rem;font-weight:600;border:0;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;transition:transform .08s}
  button.choice:hover{filter:brightness(1.08)}
  button.choice:active{transform:scale(.97)}
  .fb{margin-top:14px;padding:13px 15px;border-radius:10px;min-height:20px;font-size:.97rem}
  .fb.ok{background:#e8f5e9;border:1px solid #2e7d32}
  .fb.no{background:#fdecea;border:1px solid #c62828}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .score{color:#666;font-size:.95rem}
  button.next{padding:11px 20px;border:0;border-radius:10px;background:#444;color:#fff;cursor:pointer;font-weight:600}
  .hide{display:none}
  .done{text-align:center;padding:10px}
  .done .big{font-size:2rem;font-weight:800;color:var(--teal);margin:0}
  .done .big:focus{outline:none}
  :focus-visible{outline:3px solid #1c8a99;outline-offset:2px}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Intent or Entity?</h1>
  <p class="sub">Decide whether each item is the user&rsquo;s overall goal (the intent) or a specific detail the bot extracts (an entity). There are six rounds.</p>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>

  <div id="play">
    <div class="item" id="item"></div>
    <div class="btns">
      <button type="button" class="choice" onclick="answer('Intent')">Intent <span style="opacity:.8">(the goal)</span></button>
      <button type="button" class="choice" onclick="answer('Entity')">Entity <span style="opacity:.8">(a detail)</span></button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <span class="score" id="score">Score: 0 / 6</span>
      <button type="button" class="next hide" id="next" onclick="nxt()">Next</button>
    </div>
  </div>

  <div id="end" class="done hide">
    <h2 class="big" id="endScore" tabindex="-1"></h2>
    <p id="endMsg"></p>
    <button type="button" class="next" onclick="restart()">Play again</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</main>

<script>
  var Q=[
    {t:'"I want to book a flight"', a:'Intent', w:'The whole message states the goal (book_flight).'},
    {t:'Berlin  (a destination)',   a:'Entity', w:'It is a specific detail the bot extracts (destination).'},
    {t:'next Friday  (a date)',     a:'Entity', w:'It is a detail the bot extracts (date).'},
    {t:'"Track my order"',          a:'Intent', w:'It states the user’s goal (track_order).'},
    {t:'large  (a coffee size)',    a:'Entity', w:'It is a detail the bot extracts (size).'},
    {t:'"I’d like to order a coffee"', a:'Intent', w:'It states the goal (order_coffee).'}
  ];
  var i=0, s=0, answered=false;
  function $(id){return document.getElementById(id);}
  function say(msg){var r=$('sr');r.textContent='';setTimeout(function(){r.textContent=msg;},60);}
  function render(){
    var q=Q[i];
    $('item').textContent=q.t;
    $('fb').className='fb'; $('fb').textContent='';
    $('next').classList.add('hide');
    $('fill').style.width=(i/Q.length*100)+'%';
    $('score').textContent='Score: '+s+' / '+Q.length;
    answered=false;
  }
  function answer(c){
    if(answered) return; answered=true;
    var q=Q[i], fb=$('fb');
    if(c===q.a){ s++; fb.className='fb ok'; fb.textContent='Correct. '+q.w; }
    else { fb.className='fb no'; fb.textContent='Not quite. It’s '+(q.a==='Intent'?'an intent':'an entity')+'. '+q.w; }
    $('score').textContent='Score: '+s+' / '+Q.length;
    $('next').classList.remove('hide'); $('next').focus();
    say(fb.textContent+' Score '+s+' of '+Q.length+'.');
  }
  function nxt(){
    i++;
    if(i>=Q.length){ finish(); return; }
    render(); document.querySelector('.btns .choice').focus();
    say('Item '+(i+1)+' of '+Q.length+': '+Q[i].t);
  }
  function finish(){
    $('play').classList.add('hide');
    $('fill').style.width='100%';
    $('end').classList.remove('hide');
    $('endScore').textContent='Score: '+s+' / '+Q.length;
    $('endMsg').textContent = s===Q.length ? 'Well done. You will use this split between intents and entities when you build your A2 bot in Dialogflow.'
      : (s>=4 ? 'A good result. Remember that a message has one intent (the goal), and the specific details in it are entities.' : 'Worth another go. The goal is the intent, and each specific detail is an entity.');
    $('endScore').focus();
    say('Game over. '+$('endScore').textContent+'. '+$('endMsg').textContent);
  }
  function restart(){ i=0; s=0; $('end').classList.add('hide'); $('play').classList.remove('hide'); render(); document.querySelector('.btns .choice').focus(); }
  render();
</script>
</body>
</html>
