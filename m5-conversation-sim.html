<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversation Sim | CCN206 Module 5</title>
<link rel="stylesheet" href="style.css">
<style>
  .bubble{background:#eceff1;border-radius:14px;padding:10px 14px;margin:10px 0;max-width:92%;font-size:.98rem}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 15px;border:2px solid var(--line-strong);color:var(--ink);border-radius:12px;background:#fff;cursor:pointer;font-size:.97rem;transition:border-color .15s,transform .08s}
  .opt:hover{border-color:var(--teal)}
  .opt:active{transform:scale(.99)}
  .opt:disabled{cursor:default}
  .meter{height:10px;background:#eef1f2;border-radius:6px;overflow:hidden;margin:6px 0}
  .meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c62828,#e8a500,#2e7d32);transition:width .4s}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="game-title">Conversation Sim <span class="chip">MODULE 5</span></h1>
  <p class="game-sub">You are designing a university student-support bot. Choose the bot's reply at each turn. Each choice adds to a conversation quality score. This game relates to Assessment 2 (Conversation Design, 25%).</p>

  <div class="topbar">
    <div class="progress" aria-hidden="true"><i id="fill"></i></div>
    <span class="scorechip" id="score">Quality: 0 / 8</span>
  </div>

  <div id="thread"></div>
  <div id="opts" role="group" aria-label="Choose the bot's reply"></div>
  <div id="fb" class="feedback hide"></div>
  <div class="row"><span></span><button type="button" class="btn-ghost hide" id="next">Next</button></div>

  <div id="end" class="win hide">
    <h2 class="big" id="endBig" tabindex="-1"></h2>
    <p id="endMsg"></p>
    <button type="button" class="btn-ghost" onclick="restart()">Play again</button>
  </div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
</main>

<script>
  // Fictional scenario. Scoring draws on Grice's maxims, onboarding, repair, escalation and reciprocity.
  var TURNS=[
    {user:"i need help but i don't even know where to start 😩",
     opts:[
       {t:"Please state your student ID and the nature of your query.", p:0, f:"Cold and form-first. It ignores the student's stress and adds friction at the start, which makes for weak onboarding."},
       {t:"No worries, that's what I'm here for. Are you stuck with enrolment, fees, timetables or something else?", p:2, f:"It acknowledges how the student feels and offers a short set of options. This is good onboarding: it orients a user who doesn't know where to start."},
       {t:"I can help with enrolment, fees, timetables, IT, library, graduation, parking and 14 other services. Which one?", p:1, f:"Helpful, but too much at once. It breaks the maxim of Quantity by giving more information than the student needs."}
     ]},
    {user:"the enrolment thing isn't working and i'm freaking out",
     opts:[
       {t:"Error 0x04: invalid session token.", p:0, f:"Technical jargon breaks the maxim of Manner (be clear). A stressed student can't act on this."},
       {t:"Have you tried turning it off and on again?", p:0, f:"Dismissive and generic. It doesn't acknowledge the student's stress or narrow down the problem."},
       {t:"Okay, let's slow down. When you try to enrol, what happens? Do you see an error message, a blank page, or can you not select units?", p:2, f:"It calms the student and narrows the problem with concrete options. This is a good repair move."}
     ]},
    {user:"i tried that, still broken, and the deadline is TODAY",
     opts:[
       {t:"Unfortunately there's nothing more I can do here.", p:0, f:"A dead end, with no escalation and no way forward. This is where users lose trust."},
       {t:"Because the deadline is today, I'm marking this as urgent and connecting you with a student adviser now. I'll pass on what you've already tried.", p:2, f:"It escalates to a human and passes on the context, so the student doesn't have to repeat themselves (reciprocity)."},
       {t:"Please email the enrolment team. Replies take 3–5 business days.", p:0, f:"It ignores the urgency of a same-day deadline."}
     ]},
    {user:"ok… thank you",
     opts:[
       {t:"Bye.", p:0, f:"Too terse. There's no confirmation, no reference number and no reassurance."},
       {t:"You're now connected to Sam, who'll take it from here. Your reference number is 2231. Is there anything I can help with while you wait?", p:2, f:"It confirms the handover, gives a reference number and offers further help. A good close."},
       {t:"Is there anything else? Anything else? Anything else?", p:0, f:"Repetition like this looks like a glitch, and it breaks the maxim of Manner."}
     ]}
  ];
  var i,score,answered;
  function el(id){return document.getElementById(id);}
  function say(msg){var s=el('sr');s.textContent='';setTimeout(function(){s.textContent=msg;},60);}
  function start(){i=0;score=0;answered=false;el('end').classList.add('hide');el('thread').innerHTML='';render();}
  function render(){
    var T=TURNS[i];
    var b=document.createElement('div'); b.className='bubble'; b.innerHTML='<strong>Student:</strong> '+T.user;
    el('thread').appendChild(b);
    var O=el('opts'); O.innerHTML='';
    T.opts.forEach(function(o,k){
      var btn=document.createElement('button'); btn.type='button'; btn.className='opt'; btn.textContent='“'+o.t+'”';
      btn.onclick=function(){pick(k,btn);};
      O.appendChild(btn);
    });
    el('fb').className='feedback hide'; el('next').classList.add('hide');
    el('fill').style.width=(i/TURNS.length*100)+'%';
    el('score').textContent='Quality: '+score+' / 8';
    answered=false;
  }
  function pick(k,btn){
    if(answered)return; answered=true;
    var o=TURNS[i].opts[k]; score+=o.p;
    var opts=el('opts').children;
    for(var j=0;j<opts.length;j++){opts[j].disabled=true; if(j!==k)opts[j].style.opacity=.5;}
    btn.style.borderColor = o.p===2?'var(--ok)':(o.p===1?'var(--gold)':'var(--no)');
    btn.style.background = o.p===2?'var(--ok-bg)':(o.p===1?'#fff8e6':'var(--no-bg)');
    // echo the bot's chosen reply into the thread
    var rb=document.createElement('div'); rb.className='bubble'; rb.style.background='var(--teal-l)'; rb.style.marginLeft='auto'; rb.innerHTML='<strong>Bot:</strong> '+o.t;
    el('thread').appendChild(rb);
    var fb=el('fb'); fb.className='feedback '+(o.p===2?'ok':(o.p===1?'':'no'));
    if(o.p===1){fb.style.background='#fff8e6';fb.style.border='1px solid var(--gold)';}else{fb.style.background='';fb.style.border='';}
    fb.innerHTML=(o.p===2?'+2 points. ':(o.p===1?'+1 point. ':'0 points. '))+o.f;
    el('score').textContent='Quality: '+score+' / 8';
    el('next').classList.remove('hide'); el('next').focus();
    say(fb.textContent+' Quality score '+score+' of 8.');
  }
  function next(){
    i++;if(i>=TURNS.length){finish();return;}
    render(); el('opts').children[0].focus();
    say('Turn '+(i+1)+' of '+TURNS.length+'. Student: '+TURNS[i].user);
  }
  function finish(){
    el('opts').innerHTML=''; el('fb').className='feedback hide'; el('next').classList.add('hide');
    el('fill').style.width='100%';
    el('end').classList.remove('hide');
    el('endBig').textContent='Quality: '+score+' / 8';
    el('endMsg').textContent = score>=7 ? 'Well done. The strongest path acknowledges the student\'s feelings, narrows the problem, escalates when the bot is stuck and confirms at the end. For A2, be ready to justify each of those moves.'
      : (score>=4 ? 'A reasonable result. Look back at the replies that scored 0. Most broke a Gricean maxim, missed a chance to escalate or left the student at a dead end.' : 'Worth another try. The best replies acknowledge the student\'s feelings, keep them moving, escalate when stuck and confirm at the end.');
    el('endBig').focus();
    say('Game over. '+el('endBig').textContent+'. '+el('endMsg').textContent);
  }
  el('next').onclick=next;
  function restart(){start(); el('opts').children[0].focus();}
  start();
</script>
</body>
</html>
